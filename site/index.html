<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kotlin Lab</title>
<meta name="referrer" content="no-referrer">
<!--
  CSP: 인라인 스크립트를 쓰지 않으므로 script-src 에 'unsafe-inline' 이 없다.
  코드 실행은 api.kotlinlang.org 로만 나간다 (connect-src).
-->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'none';
  script-src 'self' https://cdnjs.cloudflare.com;
  style-src 'self' https://cdnjs.cloudflare.com 'unsafe-inline';
  connect-src 'self' https://api.kotlinlang.org;
  img-src 'self' data:;
  font-src 'self';
  base-uri 'none';
  form-action 'none';
  frame-ancestors 'none'">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css" integrity="sha384-zaeBlB/vwYsDRSlFajnDd7OydJ0cWk+c2OWybl3eSUf6hW2EbhlCsQPqKr3gkznT" crossorigin="anonymous" referrerpolicy="no-referrer">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css" integrity="sha384-eZTPTN0EvJdn23s24UDYJmUM2T7C2ZFa3qFLypeBruJv8mZeTusKUAO/j5zPAQ6l" crossorigin="anonymous" referrerpolicy="no-referrer">
<link rel="stylesheet" href="app.css">
</head>
<body>

<aside>
  <div class="brand">
    <h1>Kotlin Lab</h1>
    <p id="brandSub">불러오는 중…</p>
  </div>
  <div class="lesson-list" id="lessonList"></div>
</aside>

<main id="theory"></main>

<section class="practice">
  <div class="tabs">
    <span style="padding:11px 16px;font-size:12.5px;color:var(--fg)">연습</span>
    <span class="spacer"></span>
    <button class="assist" id="hintBtn">힌트</button>
    <button class="assist danger" id="solBtn">정답</button>
    <button class="run" id="runBtn">실행 ⌘↵</button>
  </div>
  <div class="prompt-box" id="prompt"></div>
  <div class="assist-box" id="assist" hidden></div>
  <div class="editor-wrap"><textarea id="code"></textarea></div>
  <div class="output" id="output"><span class="empty">실행 결과가 여기 표시됩니다.</span></div>
  <div class="navbar">
    <button id="prevBtn">← 이전</button>
    <span class="status" id="navStatus"></span>
    <button id="resetBtn">스타터로 되돌리기</button>
    <button id="nextBtn" class="primary">다음 →</button>
  </div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js" integrity="sha384-/TQbtLCAerC3jgaim+N78RZSDYV7ryeoBCVqTuzRrFec2akfBkHS7ACQ3PQhvMVi" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js" integrity="sha384-ZYmwuq4n2gOcNxMSiJ6jyTj+BbIrilr7p6dlq6q5nmSWKmsH9UU4K1qqjycMkfmR" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/clike/clike.min.js" integrity="sha384-o9m634t2Hy35pPNKd9Xe16ntbSw11jCOuKPDrzQGXI8k87L2JZthaA3rwmJjnF7Z" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="app.js"></script>
</body>
</html>
