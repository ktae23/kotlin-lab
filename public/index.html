<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kotlin Lab</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css">
<style>
  :root {
    --bg: #14161a;
    --panel: #1b1e24;
    --panel-2: #21252c;
    --line: #2d323b;
    --fg: #dfe3ea;
    --muted: #8b93a1;
    --accent: #7f9cf5;
    --ok: #4ade80;
    --err: #f87171;
    --warn: #fbbf24;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font: 14px/1.65 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif;
    display: grid; grid-template-columns: 232px 1fr 1fr; height: 100vh; overflow: hidden;
  }

  /* ---------- 사이드바 ---------- */
  aside { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; overflow: hidden; }
  .brand { padding: 16px 18px 12px; border-bottom: 1px solid var(--line); }
  .brand h1 { margin: 0; font-size: 15px; letter-spacing: -.2px; }
  .brand p { margin: 3px 0 0; font-size: 11.5px; color: var(--muted); }
  .lesson-list { flex: 1; overflow-y: auto; padding: 8px; }
  .lesson-list button {
    display: block; width: 100%; text-align: left; background: none; border: 0;
    color: var(--muted); font: inherit; font-size: 13px; padding: 8px 10px;
    border-radius: 6px; cursor: pointer; line-height: 1.4;
  }
  .lesson-list button:hover { background: var(--panel-2); color: var(--fg); }
  .lesson-list button.active { background: var(--accent); color: #10131a; font-weight: 600; }
  .lesson-list .num { font-family: var(--mono); font-size: 11px; opacity: .7; margin-right: 6px; }

  .watch-box { border-top: 1px solid var(--line); padding: 12px; }
  .watch-box label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .5px; }
  .watch-box input {
    width: 100%; background: var(--bg); border: 1px solid var(--line); color: var(--fg);
    border-radius: 6px; padding: 7px 9px; font: 12px var(--mono);
  }
  .watch-box input:focus { outline: none; border-color: var(--accent); }
  .watch-row { display: flex; gap: 6px; margin-top: 7px; }
  .watch-box button {
    flex: 1; background: var(--panel-2); border: 1px solid var(--line); color: var(--fg);
    border-radius: 6px; padding: 6px; font: inherit; font-size: 12px; cursor: pointer;
  }
  .watch-box button:hover { border-color: var(--accent); }
  .watch-status { margin-top: 8px; font: 11px var(--mono); color: var(--muted); word-break: break-all; }
  .watch-status.on { color: var(--ok); }

  /* ---------- 이론 ---------- */
  main { overflow-y: auto; padding: 28px 34px 60px; border-right: 1px solid var(--line); }
  main h1 { font-size: 22px; margin: 0 0 20px; letter-spacing: -.4px; }
  main h2 { font-size: 16px; margin: 30px 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
  main h3 { font-size: 14px; margin: 22px 0 8px; color: var(--accent); }
  main p, main li { color: #c7cdd8; }
  main code { font: 12.5px var(--mono); background: var(--panel-2); padding: 1.5px 5px; border-radius: 4px; color: #ffd9a0; }
  main pre { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; overflow-x: auto; }
  main pre code { background: none; padding: 0; color: #d5dbe6; font-size: 12.5px; line-height: 1.6; }
  main table { border-collapse: collapse; width: 100%; margin: 14px 0; font-size: 13px; }
  main th, main td { border: 1px solid var(--line); padding: 7px 11px; text-align: left; }
  main th { background: var(--panel-2); font-weight: 600; }
  main blockquote { margin: 14px 0; padding: 2px 16px; border-left: 3px solid var(--accent); color: var(--muted); }
  main a { color: var(--accent); }

  /* ---------- 연습 ---------- */
  section.practice { display: flex; flex-direction: column; overflow: hidden; }
  .tabs { display: flex; border-bottom: 1px solid var(--line); background: var(--panel); }
  .tabs button {
    background: none; border: 0; border-bottom: 2px solid transparent; color: var(--muted);
    font: inherit; font-size: 12.5px; padding: 11px 16px; cursor: pointer;
  }
  .tabs button.active { color: var(--fg); border-bottom-color: var(--accent); }
  .tabs .spacer { flex: 1; }
  .tabs .run {
    margin: 6px 8px; background: var(--accent); color: #10131a; border-radius: 6px;
    border: 0; padding: 6px 14px; font-weight: 600; font-size: 12.5px; cursor: pointer;
  }
  .tabs .run:disabled { opacity: .45; cursor: default; }

  .prompt-box { padding: 12px 18px; border-bottom: 1px solid var(--line); background: var(--panel-2); font-size: 13px; color: #c7cdd8; }
  .prompt-box:empty { display: none; }
  .prompt-box code { font: 12px var(--mono); background: var(--bg); padding: 1px 5px; border-radius: 4px; color: #ffd9a0; }

  .editor-wrap { flex: 1 1 55%; overflow: hidden; position: relative; }
  .CodeMirror { height: 100%; font: 13px/1.6 var(--mono); }

  .output {
    flex: 1 1 45%; border-top: 1px solid var(--line); background: var(--panel);
    overflow-y: auto; padding: 12px 16px; font: 12.5px/1.65 var(--mono); white-space: pre-wrap; word-break: break-word;
  }
  .out-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; font-family: -apple-system, sans-serif; font-size: 12px; }
  .badge { border-radius: 4px; padding: 2px 8px; font-weight: 600; font-size: 11px; }
  .badge.ok { background: rgba(74,222,128,.15); color: var(--ok); }
  .badge.err { background: rgba(248,113,113,.15); color: var(--err); }
  .badge.warn { background: rgba(251,191,36,.15); color: var(--warn); }
  .badge.muted { background: var(--panel-2); color: var(--muted); }
  .out-head .time { color: var(--muted); margin-left: auto; }
  .out-label { color: var(--muted); font-family: -apple-system, sans-serif; font-size: 11px; text-transform: uppercase; letter-spacing: .5px; margin: 12px 0 4px; }
  .out-err { color: var(--err); }
  .diff { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 6px; }
  .diff > div { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; }
  .empty { color: var(--muted); }
</style>
</head>
<body>

<aside>
  <div class="brand">
    <h1>Kotlin Lab</h1>
    <p>Java 개발자를 위한 실습 서버</p>
  </div>
  <nav class="lesson-list" id="lessonList"></nav>
  <div class="watch-box">
    <label>파일 감지 (IntelliJ 경로)</label>
    <input id="watchDir" placeholder="~/IdeaProjects/kotlin-study" spellcheck="false">
    <div class="watch-row">
      <button id="watchStart">감지 시작</button>
      <button id="watchStop">중지</button>
    </div>
    <div class="watch-status" id="watchStatus">감지 꺼짐</div>
  </div>
</aside>

<main id="theory"><p class="empty">왼쪽에서 레슨을 선택하세요.</p></main>

<section class="practice">
  <div class="tabs">
    <button id="tabEditor" class="active">웹 에디터</button>
    <button id="tabWatch">파일 감지</button>
    <span class="spacer"></span>
    <button class="run" id="runBtn">실행 ⌘↵</button>
  </div>
  <div class="prompt-box" id="prompt"></div>
  <div class="editor-wrap"><textarea id="code"></textarea></div>
  <div class="output" id="output"><span class="empty">실행 결과가 여기 표시됩니다.</span></div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/clike/clike.min.js"></script>
<script>
const $ = (id) => document.getElementById(id);
let lessons = [];
let current = null;
let mode = "editor";

const cm = CodeMirror.fromTextArea($("code"), {
  mode: "text/x-kotlin",
  theme: "material-darker",
  lineNumbers: true,
  indentUnit: 4,
  tabSize: 4,
  lineWrapping: true,
  extraKeys: { "Cmd-Enter": run, "Ctrl-Enter": run },
});

// ------------------------------------------------------------------ 레슨 로드
async function loadLessons() {
  lessons = await (await fetch("/api/lessons")).json();
  $("lessonList").innerHTML = "";
  lessons.forEach((l) => {
    const b = document.createElement("button");
    b.innerHTML = `<span class="num">${l.id.slice(0, 2)}</span>${l.title.replace(/^Lesson\s*\d+\s*—\s*/, "")}`;
    b.onclick = () => openLesson(l.id);
    b.dataset.id = l.id;
    $("lessonList").appendChild(b);
  });
  if (lessons.length) openLesson(location.hash.slice(1) || lessons[0].id);
}

async function openLesson(id) {
  const res = await fetch(`/api/lessons/${id}`);
  if (!res.ok) return;
  current = await res.json();
  location.hash = id;

  document.querySelectorAll(".lesson-list button").forEach((b) =>
    b.classList.toggle("active", b.dataset.id === id)
  );

  $("theory").innerHTML = marked.parse(current.theory);
  $("theory").scrollTop = 0;
  $("prompt").innerHTML = current.exercise?.prompt ? marked.parse(current.exercise.prompt) : "";

  // 저장해 둔 답안이 있으면 그걸, 없으면 스타터를 띄운다
  cm.setValue(current.saved ?? current.exercise?.starter ?? "fun main() {\n    \n}\n");
  $("output").innerHTML = '<span class="empty">실행 결과가 여기 표시됩니다.</span>';
}

// -------------------------------------------------------------------- 실행
async function run() {
  if (mode !== "editor") return;
  $("runBtn").disabled = true;
  $("output").innerHTML = '<span class="empty">컴파일 중… (첫 실행은 Kotlin 데몬 기동으로 10초 이상 걸릴 수 있습니다)</span>';
  try {
    const res = await fetch("/api/run", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ code: cm.getValue(), lessonId: current?.id ?? "scratch" }),
    });
    render(await res.json());
  } catch (e) {
    $("output").innerHTML = `<span class="out-err">서버 오류: ${e}</span>`;
  } finally {
    $("runBtn").disabled = false;
  }
}
$("runBtn").onclick = run;

function esc(s) {
  return String(s ?? "").replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
}

function render(r, fileLabel) {
  let badge, text;
  if (r.phase === "compile" && !r.ok) { badge = "err"; text = "컴파일 실패"; }
  else if (!r.ok) { badge = "err"; text = "런타임 오류"; }
  else if (r.passed === true) { badge = "ok"; text = "통과"; }
  else if (r.expected) { badge = "warn"; text = "출력 불일치"; }
  else { badge = "muted"; text = "실행 완료"; }

  let html = `<div class="out-head">`;
  html += `<span class="badge ${badge}">${text}</span>`;
  if (fileLabel) html += `<span style="color:var(--muted)">${esc(fileLabel)}</span>`;
  html += `<span class="time">${r.durationMs}ms</span></div>`;

  if (r.stdout?.trim()) html += `<div class="out-label">stdout</div>${esc(r.stdout.trimEnd())}`;
  if (r.stderr?.trim()) html += `<div class="out-label">${r.phase === "compile" ? "컴파일러" : "stderr"}</div><span class="out-err">${esc(r.stderr.trimEnd())}</span>`;

  if (r.expected && r.passed === false && r.ok) {
    html += `<div class="out-label">기대 출력과 비교</div><div class="diff">
      <div><div class="out-label" style="margin-top:0">내 출력</div>${esc(r.stdout.trim()) || "(없음)"}</div>
      <div><div class="out-label" style="margin-top:0">기대</div>${esc(r.expected)}</div></div>`;
  }
  $("output").innerHTML = html;
}

// ------------------------------------------------------------------ 모드 전환
function setMode(m) {
  mode = m;
  $("tabEditor").classList.toggle("active", m === "editor");
  $("tabWatch").classList.toggle("active", m === "watch");
  $("runBtn").disabled = m !== "editor";
  cm.setOption("readOnly", m === "watch" ? "nocursor" : false);
  if (m === "watch") {
    $("output").innerHTML = '<span class="empty">감지 중인 디렉토리에서 .kt 파일을 저장하면 자동으로 실행됩니다.</span>';
  }
}
$("tabEditor").onclick = () => setMode("editor");
$("tabWatch").onclick = () => setMode("watch");

// ------------------------------------------------------------------ 파일 감지
async function setWatch(dir) {
  const res = await fetch("/api/watch", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ dir }),
  });
  const data = await res.json();
  if (!res.ok) { $("watchStatus").textContent = data.error; $("watchStatus").className = "watch-status"; return; }
  applyWatch(data.watching);
  if (data.watching) setMode("watch");
}
function applyWatch(dir) {
  $("watchStatus").textContent = dir ? `감지 중: ${dir}` : "감지 꺼짐";
  $("watchStatus").className = dir ? "watch-status on" : "watch-status";
  if (dir) $("watchDir").value = dir;
}
$("watchStart").onclick = () => setWatch($("watchDir").value);
$("watchStop").onclick = () => setWatch("");
$("watchDir").addEventListener("keydown", (e) => { if (e.key === "Enter") setWatch($("watchDir").value); });

// --------------------------------------------------------------------- SSE
const es = new EventSource("/api/events");
es.addEventListener("hello", (e) => applyWatch(JSON.parse(e.data).watching));
es.addEventListener("running", (e) => {
  setMode("watch");
  $("output").innerHTML = `<span class="empty">실행 중: ${esc(JSON.parse(e.data).file)}</span>`;
});
es.addEventListener("skipped", (e) => {
  const d = JSON.parse(e.data);
  $("output").innerHTML = `<div class="out-head"><span class="badge muted">건너뜀</span><span style="color:var(--muted)">${esc(d.file)}</span></div>${esc(d.reason)}`;
});
es.addEventListener("result", (e) => {
  const d = JSON.parse(e.data);
  setMode("watch");
  cm.setValue(d.code);
  // 감지 모드에서도 현재 레슨의 기대 출력과 대조한다
  const expected = current?.exercise?.expected ?? null;
  const passed = expected ? d.ok && d.stdout.trim() === expected.trim() : undefined;
  render({ ...d, expected, passed }, d.file.split("/").slice(-1)[0]);
});

loadLessons();
</script>
</body>
</html>
